providers:
  - provider_id: gdelt
    provider_name: GDELT 2.1 Document API
    enabled: true
    priority: 2
    base_url: https://api.gdeltproject.org/api/v2/doc/doc
    max_results_per_query: 10
    timeout_seconds: 6
    delay_seconds: 3
    max_retries: 2
    backoff_base_seconds: 5
    backoff_max_seconds: 60
    cache_enabled: true
    cache_ttl_days: 14
    user_agent: BlueFernDispatches/0.1 historical-source-retrieval
    reliability_tier: unknown
  - provider_id: manual
    provider_name: Project-local manual historical sources
    enabled: true
    priority: 1
    reliability_tier: editorial-record

query_groups:
  max_queries: 8
  max_queries_per_week: 8
  max_region_terms_per_query: 8
  system_terms_per_query: 10
  target_records_per_week: 8
  region_terms:
    - Washington
    - Oregon
    - Idaho
    - Pacific Northwest
    - Cascadia
    - Seattle
    - Portland
    - Spokane
    - Boise
    - Tacoma
    - Eugene
    - Salem
  system_groups:
    - infrastructure/utilities/outages|infrastructure|utility|utilities|outage|power|water|bridge|road closure
    - health/emergency services|public health|hospital|emergency services|healthcare|Medicaid|clinic
    - environment/climate/hazards|wildfire|drought|flood|landslide|earthquake|air quality|climate
    - housing/homelessness|housing|homelessness|shelter|rent|eviction
    - labor/economy/public services|layoffs|unemployment|budget cuts|school closure|public services|workforce
    - public safety/emergency declarations|crime|public safety|emergency declaration|evacuation|emergency management
    - transportation/ports/supply chain|ferry|transit|port|rail|supply chain|transportation
    - agriculture/food assistance|agriculture|food assistance|SNAP|food bank|food insecurity
  systems_terms:
    - infrastructure
    - public health
    - hospital
    - emergency services
    - healthcare
    - Medicaid
    - clinic
    - school
    - school closure
    - housing
    - homelessness
    - shelter
    - rent
    - eviction
    - wildfire
    - drought
    - flood
    - landslide
    - earthquake
    - power outage
    - outage
    - utility
    - water
    - transportation
    - ferry
    - transit
    - bridge
    - road closure
    - rail
    - port
    - supply chain
    - public safety
    - emergency
    - emergency declaration
    - economy
    - labor
    - layoffs
    - unemployment
    - budget cuts
    - workforce
    - agriculture
    - food assistance
    - SNAP
    - food bank
    - food insecurity
    - environmental cleanup
    - climate
    - resilience

quality_targets:
  min_public_stories: 3
  target_public_stories: 5
  max_public_stories: 7

region_filters:
  states:
    - WA
    - OR
    - ID
  known_regional_domains:
    - seattletimes.com
    - spokesman.com
    - oregonlive.com
    - opb.org
    - boisedev.com
    - idahostatesman.com
    - katu.com
    - king5.com
    - kgw.com
    - kxly.com
