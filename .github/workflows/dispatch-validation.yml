name: Dispatch validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pyyaml pytest

      - name: Validate repository governance
        run: python scripts/validate_repo_governance.py

      - name: Compile source and tests
        run: python -m compileall src tests scripts

      - name: Run focused validation tests
        run: python -m pytest -q -p no:cacheprovider --basetemp ./.pytest-temp-validation tests/test_repo_governance.py tests/test_food_line_dispatch.py tests/test_dispatches_site.py

      # Broader Gaza/Cascadia/Care Line suites are deferred here to keep the
      # workflow conservative and avoid coupling Phase 2 to unrelated worktree noise.
