name: Dispatch validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - add/pages-repo-default
  workflow_dispatch:

concurrency:
  group: dispatch-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate_core:
    needs: [validate_windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Refuse cancelled validation
        if: cancelled()
        run: exit 1

      - name: Require Windows scheduler validation
        if: always()
        env:
          WINDOWS_RESULT: ${{ needs.validate_windows.result }}
        run: |
          python - <<'PY_GATE'
          import os

          result = os.environ.get("WINDOWS_RESULT", "unknown")
          if result != "success":
              raise SystemExit(f"Required Windows validation did not succeed: {result}")
          print("Windows scheduler validation succeeded")
          PY_GATE

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pytest

      - name: Prepare explicit validation test root
        run: |
          test_root="$RUNNER_TEMP/bluefern-pytest-validation"
          mkdir -p "$test_root"
          export DISPATCHES_TEST_ROOT="$test_root"
          echo "DISPATCHES_TEST_ROOT=$test_root" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          import shutil

          root = os.environ["DISPATCHES_TEST_ROOT"]
          free = shutil.disk_usage(root).free
          required = 2 * 1024**3
          if free < required:
              raise SystemExit(f"validation test root has {free} bytes free; {required} required")
          print(f"validation test root: {root} ({free} free bytes)")
          PY

      - name: Install browser for public site visual validation
        run: python -m playwright install --with-deps chromium

      - name: Validate repository governance
        run: python scripts/validate_repo_governance.py

      - name: Compile source and tests
        run: python -m compileall src tests scripts

      - name: Validate changed PowerShell syntax
        shell: pwsh
        run: |
          foreach ($scriptPath in @(
            "scripts/sync_gaza_two_file_runner.ps1",
            "scripts/sync_active_production_runners.ps1",
            "scripts/run_pytest_safe.ps1"
          )) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $scriptPath),
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${scriptPath}: $($_.Message)" }
              exit 1
            }
          }

      - name: Run focused validation tests
        run: python -m pytest -q -p no:cacheprovider --basetemp "$DISPATCHES_TEST_ROOT/pytest" tests/test_repo_governance.py tests/test_publish_scope_validation.py tests/test_autonomous_authority_contract.py tests/test_repository_consistency.py tests/test_operational_status_exporter.py tests/test_operational_status_export_task.py tests/test_care_line_source_registry_phase13.py tests/test_care_line_national_pipeline.py tests/test_care_line_deadline_entity_guards.py tests/test_care_line_scheduler_registration.py tests/test_care_line_collection_scheduler_wrapper.py tests/test_cascadia_schedule_config.py tests/test_cascadia_notify.py tests/test_doctor.py tests/test_storage_admission.py tests/test_compact_pytest_basetemp.py tests/test_validation_profiles.py tests/test_fixture_lifecycle.py tests/test_story_dedupe.py tests/test_gaza_backfill.py tests/test_gaza_sources.py tests/test_dispatches_site.py tests/test_gaza_dispatch_generation.py tests/test_run_daily_gaza.py tests/test_care_line_dispatch.py tests/test_food_line_dispatch.py tests/test_dispatches_site.py tests/test_public_site_visuals.py tests/test_staged_gaza_visuals.py tests/test_watch_ledger.py tests/test_watch_source_targets.py tests/test_ice_current_review.py tests/test_ice_monitor_normalization_regressions.py tests/test_ice_text_extraction.py tests/test_ice_dispatch_phase8.py tests/test_ice_release_bundle.py tests/test_sync_active_production_runners.py tests/test_gaza_edition_correction.py tests/test_gaza_historical_correction.py tests/test_gaza_published_story_lineage.py tests/test_gaza_daily_operator.py tests/test_gaza_two_file_runner_sync.py tests/test_gaza_immutable_release.py tests/test_gaza_operator_receipt_private.py tests/test_gaza_test_root_admission.py tests/test_gaza_production_runner_sync.py tests/test_bluesky_exact_draft_binding.py tests/test_bluesky_post.py tests/test_food_line_continuation_contract.py tests/test_gaza_layout.py tests/test_gaza_listing_metadata.py tests/test_gaza_correction_runtime_proofs.py tests/test_gaza_correction_activation.py tests/test_gaza_oct25_release_package.py tests/test_gaza_conditional_consent.py tests/test_gaza_correction_replica_matrix.py tests/test_gaza_corrected_reader_contract.py tests/test_gaza_oct25_remote_plan.py tests/test_gaza_correction_ci_selection.py tests/test_gaza_public_history_reconciliation.py tests/test_canonical_pages_checkout.py

      # Broader Gaza/Cascadia/Care Line suites are deferred here to keep the
      # workflow conservative and avoid coupling Phase 2 to unrelated worktree noise.

  validate_windows:
    name: Care scheduler wrapper (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install scheduler test dependency
        run: python -m pip install pytest

      - name: Prepare explicit Windows test root
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "bluefern-care-scheduler-validation"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          "DISPATCHES_TEST_ROOT=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python -c "import shutil,sys; free=shutil.disk_usage(sys.argv[1]).free; required=2*1024**3; print(f'test root: {free} free bytes; {required} required'); sys.exit(0 if free >= required else 1)" "$testRoot"

      - name: Run complete scheduler wrapper suite on Windows
        shell: pwsh
        run: python -m pytest -q -p no:cacheprovider --basetemp "$env:DISPATCHES_TEST_ROOT/pytest" tests/test_care_line_collection_scheduler_wrapper.py

  visual_regression:
    name: Staged Gaza visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      # Immutable public baseline; refresh deliberately with reviewed public output.
      PAGES_BASELINE_SHA: a952b7669ea16504b953fbd933cb226b4c643101
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out immutable public markup
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PAGES_BASELINE_SHA }}
          path: visual-pages-baseline
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install existing browser dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check real staged markup with unchanged visual gates
        timeout-minutes: 10
        run: |
          python scripts/check_staged_gaza_visuals.py \
            --source "$GITHUB_WORKSPACE" \
            --baseline "$GITHUB_WORKSPACE/visual-pages-baseline" \
            --baseline-sha "$PAGES_BASELINE_SHA" \
            --candidate "$RUNNER_TEMP/gaza-visual-candidate" \
            --evidence "$RUNNER_TEMP/gaza-visual-evidence"
      - name: Preserve visual report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaza-visual-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gaza-visual-evidence
          if-no-files-found: error
          retention-days: 7


  validate:
    needs: [validate_core, visual_regression]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Require all validation jobs
        env:
          CORE_RESULT: ${{ needs.validate_core.result }}
          VISUAL_RESULT: ${{ needs.visual_regression.result }}
        run: |
          test "$CORE_RESULT" = success && test "$VISUAL_RESULT" = success || {
            echo "Validation failed: core=$CORE_RESULT, staged_visuals=$VISUAL_RESULT"
            exit 1
          }

      - name: Publish validate commit status for head SHA
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const sha = context.payload.pull_request?.head?.sha;
            if (!sha) {
              throw new Error('event pull_request.head.sha is unavailable');
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'validate',
              description: state === 'success' ? 'Dispatch validation passed' : 'Dispatch validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

