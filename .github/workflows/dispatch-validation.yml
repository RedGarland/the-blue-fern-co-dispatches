name: Dispatch validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - add/pages-repo-default
  workflow_dispatch:

concurrency:
  group: dispatch-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pytest

      - name: Validate repository governance
        run: python scripts/validate_repo_governance.py

      - name: Compile source and tests
        run: python -m compileall src tests scripts

      - name: Validate production sync PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/sync_active_production_runners.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run focused validation tests
        run: python -m pytest -q -p no:cacheprovider --basetemp ./.pytest-temp-validation tests/test_repo_governance.py tests/test_publish_scope_validation.py tests/test_autonomous_authority_contract.py tests/test_repository_consistency.py tests/test_operational_status_exporter.py tests/test_operational_status_export_task.py tests/test_care_line_source_registry_phase13.py tests/test_food_line_dispatch.py tests/test_dispatches_site.py tests/test_watch_ledger.py tests/test_watch_source_targets.py tests/test_ice_current_review.py tests/test_ice_dispatch_phase8.py tests/test_ice_release_bundle.py tests/test_sync_active_production_runners.py

      - name: Publish validate commit status for head SHA
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const sha = context.payload.pull_request?.head?.sha;
            if (!sha) {
              throw new Error('event pull_request.head.sha is unavailable');
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'validate',
              description: state === 'success' ? 'Dispatch validation passed' : 'Dispatch validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      # Broader Gaza/Cascadia/Care Line suites are deferred here to keep the
      # workflow conservative and avoid coupling Phase 2 to unrelated worktree noise.
