<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cascadia Weekly Signal Map - 2026-05-10</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { --deep-blue:#12364a; --evergreen:#1f5a4c; --muted-teal:#2f7d7b; --soft-gray:#e8eeef; }
    html, body { height: 100%; margin: 0; font: 15px/1.45 "Segoe UI", Tahoma, sans-serif; background: linear-gradient(180deg,#f7fbfc,#eaf1f2); color:#13252f; }
    .shell { position: relative; height: 100%; }
    #map { height: 100%; width: 100%; }
    .map-note { position:absolute; left:14px; top:14px; z-index:900; background:rgba(255,255,255,.9); padding:8px 10px; border-radius:10px; max-width:380px; border:1px solid #c8d7db; }
    .controls { position:absolute; right:14px; top:14px; z-index:900; display:flex; gap:8px; }
    .btn { border:1px solid #b6c9cf; background:#fff; color:#12364a; border-radius:999px; padding:6px 10px; cursor:pointer; font-size:13px; }
    details.legend { position:absolute; right:14px; bottom:14px; z-index:900; background:#fff; border:1px solid #c8d7db; border-radius:10px; padding:8px 10px; width:250px; }
    details.legend summary { cursor:pointer; font-weight:600; color:var(--deep-blue); }
    .tip { font-size:12px; color:#35515f; }
    .scope-local{color:var(--evergreen);} .scope-county{color:var(--muted-teal);} .scope-state{color:var(--deep-blue);}
    .leaflet-tooltip { background:#103545; color:#f2f8f9; border:0; box-shadow:none; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="map-note">Regional systems weather map built from source-backed public reporting across Washington, Oregon, and Idaho.</div>
    <div class="controls"><button id="showGrouped" class="btn">Grouped</button><button id="showSingle" class="btn">Individual</button></div>
    <details class="legend"><summary>Legend</summary><p class="tip"><span class="scope-local">Circle</span>: Local<br><span class="scope-county">Square</span>: County/area<br><span class="scope-state">Diamond</span>: Statewide</p></details>
    <div id="map"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([45.8, -120.5], 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    fetch('./map_data.json').then((r) => r.json()).then((payload) => {
      const markers = payload.markers || [];
      const grouped = payload.grouped_markers || [];
      let active = [];
      function clear() { active.forEach((m) => map.removeLayer(m)); active = []; }
      function shape(scope) {
        if (scope === "statewide") return '<div style="width:20px;height:20px;background:#12364a;transform:rotate(45deg);border-radius:3px;"></div>';
        if (scope === "county") return '<div style="width:18px;height:18px;background:#2f7d7b;border-radius:4px;"></div>';
        return '<div style="width:16px;height:16px;background:#1f5a4c;border-radius:50%;"></div>';
      }
      function popup(item) {
        return `<strong>${item.regional_area || item.state_or_region || 'Place'}</strong><br>` +
          `Pressure type: ${item.pressure_type}<br>` +
          `What we found: ${item.what_we_found}<br>` +
          `Why it matters: ${item.why_it_matters}<br>` +
          `Source: <a href="${item.source_url}" target="_blank" rel="noopener noreferrer">${item.publisher || 'Source'}</a><br>` +
          `Read more: <a href="${item.read_more || '/cascadia/'}">Edition</a>`;
      }
      function draw(rows) {
        clear();
        const bounds = [];
        for (const item of rows) {
          const icon = L.divIcon({className:'', html:shape(item.marker_scope || 'local'), iconSize:[20,20]});
          const marker = L.marker([item.lat, item.lon], {icon}).addTo(map).bindPopup(popup(item)).bindTooltip(
            `<strong>${item.regional_area || item.state_or_region || 'Place'}</strong><br>${item.what_we_found || 'Source-backed report'}`
          );
          active.push(marker);
          bounds.push([item.lat, item.lon]);
        }
        if (bounds.length) map.fitBounds(bounds, {padding:[36,36], maxZoom:7});
      }
      draw(grouped.length ? grouped : markers);
      document.getElementById('showGrouped').addEventListener('click', () => draw(grouped.length ? grouped : markers));
      document.getElementById('showSingle').addEventListener('click', () => draw(markers));
    });
  </script>
</body>
</html>
